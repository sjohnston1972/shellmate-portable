# The ShellMate licence service and admin portal (#447). Deploy from this
# folder with `wrangler deploy`.
#
# One-time setup:
#   wrangler d1 create shellmate-licences          -> paste the id below
#   wrangler d1 execute shellmate-licences --remote --file=schema.sql
#   wrangler secret put SIGNING_KEY_PKCS8_B64      -> the Ed25519 private key, PKCS#8 DER, base64
#   wrangler secret put ADMIN_PASSWORD             -> the portal password
#   wrangler secret put SESSION_SECRET             -> a long random string
name = "shellmate-admin"
main = "worker.js"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "shellmate-admin.foundry-ns.com", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "shellmate-licences"
database_id = "30745975-14f7-41d6-b1f6-283e3bfdc20b"

# Logins and public licence requests, per IP.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

# The application's own calls (refresh, activate, deactivate, check), per IP.
# Wider than the login bucket on purpose: an organisation's seats sit behind
# one NAT and all install on the same morning (#508). Without this binding
# the Worker falls back to RATE_LIMITER for them.
[[ratelimits]]
name = "APP_LIMITER"
namespace_id = "1003"
simple = { limit = 300, period = 60 }

# Weekly, Monday 04:17 UTC: prune login and refreshed events older than 90
# days (worker.js scheduled()). Nothing else ever deletes an event.
[triggers]
crons = ["17 4 * * 1"]

[vars]
PUBLIC_KEY_B64 = "5LJXi4D4Lil3nYxIkY+otMGD2O05SrIWJypmQ4Qhqn8="
PORTAL_TITLE = "ShellMate Admin"
# Cloudflare Access in front of the portal: the team domain and the application's
# audience tag. A valid Access identity signs in without the password.
ACCESS_TEAM_DOMAIN = "clydeford.cloudflareaccess.com"
ACCESS_AUD = "b9ebc6a5a5c64e5e7698027eb993afd16d93bdd544076639023aa91e654a5b0a"
