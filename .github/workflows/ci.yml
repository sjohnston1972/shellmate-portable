# CI for ShellMate Portable (#422, #423).
#
# One job, on Windows, because that is what ships: the tests exercise DPAPI,
# icacls, the Edge lookup and the WebView2 window fallbacks, none of which a
# Linux runner can vouch for. Every test_*.py runs through tools/run_tests.py
# so a single failing file fails the job, then the executable is built the
# same way a release is built, started once and asked for its health, its
# licence status and a frontend file (#516) — the tests run from source, so
# only this catches a hidden import or data file that build.spec missed
# and that comes back empty in a frozen build — and kept as an artifact.
#
# A tag of the form v1.2.3 also publishes a GitHub release carrying the exe,
# which is what the in-app update check compares itself against.
#
# Code signing runs only when the repository holds a certificate:
#   SIGN_CERT_PFX_BASE64  the .pfx, base64-encoded
#   SIGN_CERT_PASSWORD    its password
# Without them an ordinary push builds unsigned, but a release tag fails:
# an unsigned release would otherwise ship with no line saying so (#505).
# The secrets are mapped at job level because a step's `if` is evaluated
# before that step's own `env:` exists — a step-level mapping is always
# empty at that moment and the step never runs. Windows SDK signtool ships
# on the hosted runner.

name: CI

on:
  push:
    branches: [main, portable]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to attach the exe to a release

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SIGN_CERT_PFX_BASE64: ${{ secrets.SIGN_CERT_PFX_BASE64 }}
      SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # build_info.json records the commit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # The install reads the lock, so the cache has to turn over with it.
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -r requirements-dev.txt
          python -m playwright install chromium

      - name: Run every test
        run: python tools/run_tests.py
        env:
          PYTHONUTF8: "1"

      - name: Build the portable executable
        run: pyinstaller build.spec --noconfirm

      # The frozen exe, not the source tree: --no-window serves and opens
      # nothing. The port comes from ShellMate-Data/shellmate.lock beside
      # the exe once it is up (8765 is tried in the meantime, being its
      # preference); then every request below must answer 200 with a body.
      # A startup failure in a windowed build shows a message box and waits,
      # which is why there is a deadline and the log is printed either way.
      - name: Run the executable it built
        shell: pwsh
        run: |
          $exe = Resolve-Path dist\ShellMate-Portable.exe
          $data = Join-Path (Split-Path $exe) "ShellMate-Data"
          $lock = Join-Path $data "shellmate.lock"
          $log = Join-Path $data "shellmate.log"
          $proc = Start-Process -FilePath $exe -ArgumentList "--no-window" -PassThru
          $failed = $null
          try {
            $port = 0
            $deadline = (Get-Date).AddSeconds(120)
            while ((Get-Date) -lt $deadline) {
              if ($proc.HasExited) { throw "The executable exited with code $($proc.ExitCode) before it was serving." }
              $try = 8765
              if (Test-Path $lock) {
                try { $try = [int](Get-Content $lock -Raw | ConvertFrom-Json).port } catch { }
              }
              try {
                $r = Invoke-WebRequest "http://127.0.0.1:$try/api/health" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200 -and $r.Content -match 'shellmate-portable') { $port = $try; break }
              } catch { }
              Start-Sleep -Milliseconds 500
            }
            if (-not $port) { throw "Nothing answered /api/health within 120 s." }
            Write-Host "Serving on port $port"
            foreach ($path in "/api/health", "/api/licence", "/", "/static/js/terminal.js", "/static/vendor/xterm.js") {
              $r = Invoke-WebRequest "http://127.0.0.1:$port$path" -UseBasicParsing -TimeoutSec 10
              if ($r.StatusCode -ne 200) { throw "$path answered $($r.StatusCode)" }
              if ($r.Content.Length -lt 20) { throw "$path answered 200 with an empty body" }
              Write-Host ("  {0,-28} 200  {1,8} bytes" -f $path, $r.Content.Length)
            }
          } catch {
            $failed = $_
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            if (Test-Path $log) { Write-Host "----- shellmate.log -----"; Get-Content $log -Tail 60 }
          }
          if ($failed) { Write-Host "::error::$failed"; exit 1 }

      - name: Refuse to release unsigned
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGN_CERT_PFX_BASE64 == ''
        shell: pwsh
        run: |
          Write-Host "::error::A release tag needs the SIGN_CERT_PFX_BASE64 and SIGN_CERT_PASSWORD secrets; this build would ship unsigned."
          exit 1

      - name: Sign the executable
        if: env.SIGN_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /f $pfx /p $env:SIGN_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\ShellMate-Portable.exe
          & $signtool verify /pa dist\ShellMate-Portable.exe
          Remove-Item $pfx

      - name: Checksum and release notes
        run: python tools/release_notes.py --version "${{ github.ref_name }}" --exe dist/ShellMate-Portable.exe

      - name: Keep the executable
        uses: actions/upload-artifact@v4
        with:
          name: ShellMate-Portable-${{ github.sha }}
          path: |
            dist/ShellMate-Portable.exe
            dist/ShellMate-Portable.exe.sha256
          if-no-files-found: error

      # The in-app updater (#443) verifies the download against the
      # .sha256 and shows the notes from the What's new page (#445).
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ShellMate-Portable.exe
            dist/ShellMate-Portable.exe.sha256
          body_path: dist/release-notes.md
