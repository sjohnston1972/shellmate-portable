services:
  shellmate:
    container_name: shellmate
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override host so uvicorn binds inside the container (the .env default is 127.0.0.1)
      SHELLMATE_HOST: 0.0.0.0
      SHELLMATE_PORT: 8765
      # REQUIRED for this deployment, and ShellMate refuses to start without
      # it. Binding 0.0.0.0 removes the only thing protecting SSH sessions to
      # your network equipment, your saved credentials and the file browser —
      # ShellMate has no authentication by default precisely because nothing
      # but the local machine can normally reach the port.
      #
      # Put a long random string in .env as SHELLMATE_AUTH_TOKEN. A reverse
      # proxy that authenticates in front of this is still worth having; the
      # token is the floor, not the ceiling.
      SHELLMATE_AUTH_TOKEN: ${SHELLMATE_AUTH_TOKEN:?set SHELLMATE_AUTH_TOKEN in .env — this deployment is reachable from the network}
    extra_hosts:
      # Lets the container reach Ollama (or any other service) running on the Windows host
      - "host.docker.internal:host-gateway"
    volumes:
      # Settings, connection profiles and session logs all live in this one
      # directory now (see backend/paths.py), so a single mount persists
      # everything across container rebuilds.
      - ./ShellMate-Data:/app/ShellMate-Data
    ports:
      # Optional: expose for direct local access at http://localhost:8765
      # The Cloudflare tunnel reaches the container via the net_core network and does not need this.
      - "8765:8765"
    networks:
      - net_core

networks:
  net_core:
    external: true
